name: Carte DPE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # tous les lundis a 6h UTC

permissions:
  contents: write

jobs:
  extraction:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      ADEME_API_KEY: ${{ secrets.ADEME_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Diagnostic API ADEME
        continue-on-error: true
        run: python dpe_carte.py --diagnostic

      - name: Extraction, carte et exports uMap
        run: python dpe_carte.py --codes codes-postaux.txt --depuis 2026-01-01

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dpe
          path: |
            dpe.csv
            carte.html
            dpe.geojson
            dpe.umap

      - name: Publication dans le depot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dpe.csv carte.html dpe.geojson dpe.umap
          git diff --staged --quiet || git commit -m "maj DPE $(date +%F)"
          git push
